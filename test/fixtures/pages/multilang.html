<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: CJK, Turkish and Arabic</title></head>
<body>
<main>
<h1>Languages in one page</h1>
<p lang="ja">東京は日本の首都であり、世界最大の都市圏の一つです。</p>
<p lang="tr">İstanbul'da şehir hatları vapuru her sabah Kadıköy'den kalkar.</p>
<p lang="ar" dir="rtl">القاهرة هي عاصمة مصر وأكبر مدنها.</p>
<p id="js" lang="ja"></p>
</main>
<script>
document.getElementById("js").textContent = "京都は古い寺院と庭園で知られています。";
</script>
</body>
</html>
